<!doctype html>
<html lang="de">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Titel</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

        <style>
            /* Style the navigation*/
            nav {
                height: 200px;
                width: 100%;
                background-color: rgb(125, 183, 92);
            }

            /* Style the section*/
            section {
                height: 3000px;
                width: 100%;
            }

            /* Style the footer*/
            footer {
                height: 400px;
                width: 100%;
                background-color: rgb(125, 183, 92);
                margin-bottom: 100px;
            }

        </style>
    </head>
    <body>
        <nav>
            <div class="container">
                <div class="row"></div>
                <div class="col-lg-1"></div>
                <div class="col-lg-2">
                <img src="img/logo/logo.png" alt="The logo fo the website.">
                </div>
                <div class="col-lg-6"></div>
                <div class="col-lg-2">
                    <input type="submit" value="DROPDOWN">
                </div>
                    <div class="col-lg-1"></div>
            </div>

            

        </nav>
        <section>
            <div id="carousel" class="carousel slide">
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img src="img/imgCarouselAndTitle/1.jpg" class="d-block w-100" alt="The parrot.">
                        <div class="carousel-caption top-50 start-50 translate-middle"></div>
                    </div>
                    <div class="carousel-item">
                        <img src="img/imgCarouselAndTitle/2.jpg" class="d-block w-100" alt="The tiger.">
                        <div class="carousel-caption top-50 start-50 translate-middle"></div>
                    </div>
                    <div class="carousel-item">
                        <img src="img/imgCarouselAndTitle/3.jpg" class="d-block w-100" alt="The turtle.">
                        <div class="carousel-caption top-50 start-50 translate-middle"></div>
                    </div>
                </div>

                <button class="carousel-control-prev" type="button" data-bs-target="#carousel" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carousel" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </section>

        <footer>

        </footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
