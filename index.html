<!doctype html>
<html lang="de">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Index</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://fonts.google.com/specimen/Ovo?preview.script=Latn.family=Ovo">

        <style>
            /* Style the navigation*/
            nav {
                height: 200px;
                width: 100%;
                background-color: rgb(125, 183, 92);

                display: flex;
                align-items: center;
            }
            .column {
                width: 100%;
            }
            .row {
                display: flex;
                align-items: center;
                width: 100%;
            }
            .col-lg-1, .col-lg-2, .col-lg-3, .col-lg-4 {
                display: flex;
                align-items: center;
            }
            .col-lg-3 {
                gap: 30px;
            }
            .navbtn {
                font-family: Ovo;
                color: black;
                font-size: 1.5em;
                text-decoration: none;
            }
            nav input {
                width: 220px;
                height: 80px;
                border-radius: 45px;
            }
            .dropdown {
                font-family: Ovo;
                font-size: 1.5em;
            }
            

            /* Style the section*/
            section {
                height: 2000px;
                width: 100%;
            }

            /* Style the footer*/
            footer {
                height: 300px;
                width: 100%;
                background-color: rgb(125, 183, 92);
                margin-bottom: 100px;
                padding-top: 55px;
            }
            .social-icons {
                display: flex;
                align-items: center;
                gap: 20px;
            }
            
        </style>
    </head>
    <body>
        <!The Navigation>
        <nav>
            <div class="column">
                <div class="row">
                <div class="col-lg-1"></div>
                <div class="col-lg-1">
                <img src="img/logo/logo.png" alt="The logo fo the website."></div>
                <div class="col-lg-3">
                <a class="navbtn" href="#">INDEX</a>
                <a class="navbtn" href="#">KONTAKT</a>
                <a class="navbtn" href="#">BLOG</a>
                </div>
                <div class="col-lg-4"></div>
                <div class="col-lg-2">
                    <input class="dropdown" type="submit" value="DROPDOWN">
                </div>
                    <div class="col-lg-1"></div>
                </div>
            </div>
        </nav>

        <!The section>
        <section>
            <div id="carousel" class="carousel slide">
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img src="img/imgCarouselAndTitle/1.jpg" class="d-block w-100" alt="The parrot.">
                        <div class="carousel-caption top-50 start-50 translate-middle"></div>
                    </div>
                    <div class="carousel-item">
                        <img src="img/imgCarouselAndTitle/2.jpg" class="d-block w-100" alt="The tiger.">
                        <div class="carousel-caption top-50 start-50 translate-middle"></div>
                    </div>
                    <div class="carousel-item">
                        <img src="img/imgCarouselAndTitle/3.jpg" class="d-block w-100" alt="The turtle.">
                        <div class="carousel-caption top-50 start-50 translate-middle"></div>
                    </div>
                </div>

                <button class="carousel-control-prev" type="button" data-bs-target="#carousel" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carousel" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </section>

        <footer>
            <div class="column">
                <div class="row">
                <div class="col-lg-1"></div>
                <div class="col-lg-2">
                <p>Kontakt <br><br>
                Noser Young AG <br>
                Herostrasse 12 <br>
                CH-8048 Zürich <br><br>
                zuerich@noseryoung.ch <br>
                +41 31 917 53 80</p>
                </div>
                <div class="col-lg-5"></div>
                <div class="col-lg-3 social-icons">
                    <img src="img/socialMediaIcons/facebook.png" width="40px" height="40px" alt="facebook icon">
                    <img src="img/socialMediaIcons/instagram.png" width="40px" height="40px" alt="instagram icon">
                    <img src="img/socialMediaIcons/pinterest.png" width="40px" height="40px" alt="pinterest icon">
                    <img src="img/socialMediaIcons/twitter.png" width="40px" height="40px" alt="twitter icon">
                </div>
                <div class="col-lg-1"></div>
                </div>
            </div>



        </footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
